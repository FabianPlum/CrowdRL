[project]
name = "crowdrl-core"
version = "0.1.0"
description = "Shared geometry, perception, and action library for CrowdRL — no RL or JuPedSim dependencies"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "shapely>=2.0",
]

[project.optional-dependencies]
# Constrained Delaunay triangulation, needed only to *build* a navmesh from a
# polygon (triangulate_polygon / build_navmesh). Training generates geometry, so
# crowdrl-env and crowdrl-torch require this extra. Deployment consumes an
# existing geometry via WorldState and does not, which keeps the JuPedSim-side
# install free of a compiled triangulation library.
geometry = [
    "triangle>=20250106",
]
dev = [
    "pytest>=8.0",
    "pytest-cov",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crowdrl_core"]
