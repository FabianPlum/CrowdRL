# =============================================================================
# CrowdRL MAPPO -- density v2: resume the r500 peak after the NaN-hardening fix
# =============================================================================
# Identical reward/action config to exp_..._density.yaml. That run hit a NaN
# cascade at r855: a high-density pileup drove the velocity-weighted penalties to
# blow up through an UNGUARDED pre-contact velocity snapshot, corrupting the
# actor weights to NaN. Fixed in commit 8e0104f -- compute_rewards now nan_to_num's
# the snapshot and caps the impact speed at 10 m/s. This config RESUMES from the
# original density run's r500 peak (best, pre-blowup checkpoint) with the fix
# active:
#   --init_from results_exp_nogoaldir_stable_bigrooms_density/checkpoint_rollout_0500.pt
# Separate output dir (results_..._density_v2/) preserves the original run's record.
#
# Branch off velprox (sharpturn + velocity-weighted collision + proximity).
# velprox solved the moderate-density freezing but PLATEAUED at ~0.6 on the
# training distribution because the 60-100 agent HIGH-DENSITY regime still
# freezes (scorecard: <=30 agents goal 0.91, but 60-100 agents goal 0.49 with
# freeze 0.33 / stuck 0.21). The policy stops at a crowd's edge / jams rather
# than packing through.
#
# Philosophy: NO yielding convention -- if lane formation / self-organisation
# emerges, it emerges. Instead, two small reward tweaks make dense packing
# REWARD-VIABLE so the policy can choose to push through:
#  (1) collision_speed_floor 0.5 -> 0.1. The collision penalty fires on overlap;
#      P1 already weights it by closing speed, but the 0.5 floor still charged
#      ~-1/step for resting contact. Dropping to 0.1 lets agents be packed /
#      touching at LOW speed for ~-0.2/step (a gentle deterrent, not a wall),
#      while a real crash (high closing speed) still costs ~-2.3/step.
#      "Close without crashing, especially at low speed."
#  (2) progress_weight 1.5 -> 2.5. Reward route progress more than the one-shot
#      goal bonus -- partial progress through a dense crowd is the interesting,
#      dense learning signal, and it raises the opportunity cost of freezing
#      (a stuck agent earns zero progress).
#
# scorecard_during_training: true -- every checkpoint writes scorecard_r<N>.json
# across the moderate AND 60-100 agent high-density suite, so we watch the
# regime that actually matters instead of the easy half.
#
# WARM-START: launch with
#   --init_from results_exp_nogoaldir_stable_bigrooms/checkpoint_rollout_0150.pt
# Reward-only change; obs/network unchanged so the weight load is clean.
# Both GPUs (DDP). Output -> results_exp_nogoaldir_stable_bigrooms_density/
# A/B baseline: velprox. Watch the high-density scorecard rows (rooms/composed
# 60-100) for goal up + freeze/stuck down WITHOUT collision climbing.
# =============================================================================

seed: 42
n_envs: 64
max_agents: 100
steps_per_collect: 1280000
n_rollouts: 4000
log_interval: 5
compile_step: true
checkpoint_interval: 50
render_during_training: true
render_interval: 0
scorecard_during_training: true   # NEW: periodic decomposed eval (incl. 60-100 agents)
scorecard_max_steps: 1500

curriculum:
  metric_window: 100
  min_episodes_per_phase: 500
  phases:
    - name: easy
      tiers: [TIER_0]
      agents: [5, 10]
      threshold: 0.70
    - name: medium
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.60
    - name: hard
      tiers: [TIER_1, TIER_2]
      agents: [15, 30]
      threshold: 0.50
    - name: rooms
      tiers: [TIER_2, TIER_3A]
      agents: [15, 60]
      threshold: 0.50
    - name: composed
      tiers: [TIER_3A, TIER_3B]
      agents: [20, 60]
      threshold: 0.40
    - name: full
      tiers: [TIER_0, TIER_1, TIER_2, TIER_3A, TIER_3B]
      agents: [10, 100]
      threshold: 0.0
      tier_weights: [0.05, 0.05, 0.1, 0.35, 0.45]

geometry:
  min_side: 12.0
  max_side: 22.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 18.0]

observation:
  use_navmesh: true
  use_goal_direction: false
  use_temporal_memory: true
  temporal_memory_window: 50

action:
  max_heading_change_deg: 4.8      # raw per-step ceiling (240 deg/s); the coupling
  max_torso_change_deg: 4.8        # envelope below is what actually sets the rate
  speed_turn_coupling: true
  turn_lat_accel: 2.0
  turn_pivot_rate_deg: 240.0       # was 120 -- 2x in-place yaw (this is the real turn-rate knob)

reward:
  goal_bonus: 20.0
  collision_penalty: -2.0
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 2.5            # was 1.5 -- weigh route progress over the one-shot goal
  inverse_distance_weight: 0.0
  speed_deviation_weight: 0.0
  use_smoothness: false
  wall_proximity_penalty: -0.1
  wall_proximity_threshold: 1.5
  wall_collision_penalty: -0.5
  agent_proximity_penalty_near: -0.025
  agent_proximity_penalty_far: -0.001
  personal_space_radius: 1.0
  action_rate_weight: -0.001
  # --- velocity-weighted collision (P1), with a LOWER floor for dense packing ---
  use_velocity_weighted_collision: true
  collision_speed_floor: 0.1     # was 0.5 -- low-speed contact ~-0.2/step (close != crash)
  collision_speed_scale: 0.5     # a real crash (high closing speed) still ~-2.3/step
  # --- velocity-weighted proximity (carried over from velprox) ---
  use_velocity_weighted_proximity: true
  proximity_speed_floor: 0.0
  proximity_speed_scale: 0.5

max_steps: 3000
desired_velocity_weight: 0.8

episode:
  stuck_termination_enabled: false
  stuck_window_steps: 300
  stuck_progress_threshold: 0.2

network:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]

ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 10
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: cosine
  entropy_coef: 0.001
  max_grad_norm: 1.0
  use_huber_loss: true
  huber_delta: 10.0

eval:
  n_episodes: 10
  agent_range: [8, 25]
  render_video: true
  video_scenario: 7
