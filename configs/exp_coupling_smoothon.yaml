# =============================================================================
# CrowdRL MAPPO -- Speed-turn coupling, Arm B (smoothness ON)
# =============================================================================
# Derived from full_training.yaml. Companion to exp_coupling_smoothoff.yaml.
# Same physical speed-turn coupling, but KEEPS the jerk/angular-accel smoothness
# penalties (use_smoothness: true). Comparing A (off) vs B (on) tells us whether
# the penalties still help once the coupling makes "slow before the turn"
# physically enforced -- or whether (as hypothesised) they cause "ice-skating".
# One GPU each (pin via CUDA_VISIBLE_DEVICES). Agents ramp to 100.
# Output -> results_exp_coupling_smoothon/
# =============================================================================

seed: 42
n_envs: 64
max_agents: 100
steps_per_collect: 1280000
n_rollouts: 4000            # ~24h at observed SPS (~97k early phase)
log_interval: 5
compile_step: true
checkpoint_interval: 100    # save checkpoint_rollout_<N>.pt every 100 -- keep the peak (run 1 collapsed late and was never saved)

curriculum:
  metric_window: 100
  min_episodes_per_phase: 500
  phases:
    - name: easy
      tiers: [TIER_0]
      agents: [5, 10]
      threshold: 0.70
    - name: medium
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.60
    - name: hard
      tiers: [TIER_1, TIER_2]
      agents: [15, 30]
      threshold: 0.50
    - name: rooms
      tiers: [TIER_2, TIER_3A]
      agents: [15, 60]
      threshold: 0.50
    - name: composed
      tiers: [TIER_3A, TIER_3B]
      agents: [20, 60]
      threshold: 0.40
    - name: full
      tiers: [TIER_0, TIER_1, TIER_2, TIER_3A, TIER_3B]
      agents: [40, 100]
      threshold: 0.0
      tier_weights: [0.05, 0.05, 0.1, 0.35, 0.45]

geometry:
  min_side: 8.0
  max_side: 15.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 18.0]

observation:
  use_navmesh: true
  use_temporal_memory: true
  temporal_memory_window: 50

# --- Speed-turn coupling: turning sharply requires slowing down ---
action:
  max_heading_change_deg: 1.2     # 120 deg/s at dt=0.01 (== pivot cap)
  max_torso_change_deg: 1.2
  speed_turn_coupling: true
  turn_lat_accel: 2.0             # m/s^2 comfortable centripetal acceleration
  turn_pivot_rate_deg: 120.0      # deg/s max in-place yaw (v->0)

reward:
  goal_bonus: 20.0
  collision_penalty: -1.0
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 1.5
  inverse_distance_weight: 0.0
  speed_deviation_weight: 0.0
  use_smoothness: true            # Arm B: keep jerk + angular-accel penalties
  wall_proximity_penalty: -0.1
  wall_proximity_threshold: 1.5
  agent_proximity_penalty_near: -0.01
  agent_proximity_penalty_far: -0.0001
  personal_space_radius: 1.0
  action_rate_weight: -0.01

max_steps: 2000
desired_velocity_weight: 0.8

episode:
  stuck_termination_enabled: true
  stuck_window_steps: 300
  stuck_progress_threshold: 0.2

network:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]

ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 10
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: cosine
  entropy_coef: 0.02         # 2x the 0.01 default (too low -> entropy collapse in run 1; raise to sustain exploration)

eval:
  n_episodes: 10
  agent_range: [8, 25]
  render_video: true
  video_scenario: 7
