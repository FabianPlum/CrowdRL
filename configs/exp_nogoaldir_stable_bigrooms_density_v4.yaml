# =============================================================================
# CrowdRL MAPPO -- density v4: CAP the collision penalty (discount-only weighting)
# =============================================================================
# v4 = density_v3 settings VERBATIM (full agent speed, max_forward_speed 2.0) plus
# ONE change: collision_penalty_cap = -2.0.
#
# WHY (the regroup conclusion). Every blowup is preceded by a high-density pileup
# driving the collision penalty to extreme magnitudes (coll_ag -331 -> NaN in the
# full phase; -1086/-1376 -> gridlock in the slow60 diagnostic). The collision
# penalty is already per-agent / worst-contact (not summed), but the velocity
# weighting AMPLIFIES fast impacts: -2.0 * (0.25 + 0.5*impact) reaches ~-4.5/step.
# The slow60 run proved that scaling by closing speed is the WRONG variable --
# slowing agents made pileups WORSE (longer time jammed), not better.
#
# THE CAP. collision_penalty_cap = -2.0 floors the per-step collision penalty at
# the BASE magnitude: the velocity weighting may now only DISCOUNT slow contact
# (down to -0.5/step at the floor) and can NO LONGER amplify fast contact below
# -2.0/step. This removes the amplification (the explosion/NaN precursor) while
# keeping "slow contact is cheap" intact. NO yielding convention -- still emergent.
#   - If it clears the full phase without NaN AND without gridlock: the cap is the
#     fix; tune from here.
#   - If coll_ag still dominates (duration-driven): next step is a cumulative
#     per-episode collision cap (bounds the episode contribution outright).
#
# obs-NaN guard (e48ade3) active. Warm-start from the density r500 peak:
#   --init_from results_exp_nogoaldir_stable_bigrooms_density/checkpoint_rollout_0500.pt
# Both GPUs (DDP). Output -> results_exp_nogoaldir_stable_bigrooms_density_v4/
# Watch: coll_ag magnitude (should stay bounded), GoalRate in full phase, no NaN.
# =============================================================================

seed: 42
n_envs: 64
max_agents: 100
steps_per_collect: 1280000
n_rollouts: 4000
log_interval: 5
compile_step: true
checkpoint_interval: 50
render_during_training: true
render_interval: 0
scorecard_during_training: true
scorecard_max_steps: 1500

curriculum:
  metric_window: 100
  min_episodes_per_phase: 500
  phases:
    - name: easy
      tiers: [TIER_0]
      agents: [5, 10]
      threshold: 0.70
    - name: medium
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.60
    - name: hard
      tiers: [TIER_1, TIER_2]
      agents: [15, 30]
      threshold: 0.50
    - name: rooms
      tiers: [TIER_2, TIER_3A]
      agents: [15, 60]
      threshold: 0.50
    - name: composed
      tiers: [TIER_3A, TIER_3B]
      agents: [20, 60]
      threshold: 0.40
    - name: full
      tiers: [TIER_0, TIER_1, TIER_2, TIER_3A, TIER_3B]
      agents: [10, 100]
      threshold: 0.0
      tier_weights: [0.05, 0.05, 0.1, 0.35, 0.45]

geometry:
  min_side: 12.0
  max_side: 22.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 18.0]

observation:
  use_navmesh: true
  use_goal_direction: false
  use_temporal_memory: true
  temporal_memory_window: 50

action:
  # max_forward_speed / max_backward_speed left at defaults (2.0 / 0.5) -- v3 speed.
  max_heading_change_deg: 4.8
  max_torso_change_deg: 4.8
  speed_turn_coupling: true
  turn_lat_accel: 2.0
  turn_pivot_rate_deg: 240.0

reward:
  goal_bonus: 20.0
  collision_penalty: -2.0
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 2.0
  inverse_distance_weight: 0.0
  speed_deviation_weight: 0.0
  use_smoothness: false
  wall_proximity_penalty: -0.1
  wall_proximity_threshold: 1.5
  wall_collision_penalty: -0.5
  agent_proximity_penalty_near: -0.025
  agent_proximity_penalty_far: -0.001
  personal_space_radius: 0.75
  action_rate_weight: -0.001
  # --- velocity-weighted collision (P1), now CAPPED to discount-only ---
  use_velocity_weighted_collision: true
  collision_speed_floor: 0.25
  collision_speed_scale: 0.5
  collision_penalty_cap: -2.0       # v4: NEW -- floor per-step collision at the base -2.0
  # --- velocity-weighted proximity ---
  use_velocity_weighted_proximity: true
  proximity_speed_floor: 0.0
  proximity_speed_scale: 0.5

max_steps: 3000
desired_velocity_weight: 0.8

episode:
  stuck_termination_enabled: false
  stuck_window_steps: 300
  stuck_progress_threshold: 0.2

network:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]

ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 10
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: cosine
  entropy_coef: 0.003
  max_grad_norm: 1.0
  use_huber_loss: true
  huber_delta: 10.0

eval:
  n_episodes: 10
  agent_range: [8, 25]
  render_video: true
  video_scenario: 7
