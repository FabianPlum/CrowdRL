# =============================================================================
# Smoke test for Layer 1 v2 of agent_dynamics_refactor.
# Goal: exercise the full pipeline end-to-end against the Layer 1 v2 config
# (asymmetric action range, max_velocity_magnitude, preferred_speed in ego
# obs, retuned smoothness weights) and confirm no surprises in
# rollout collection, PPO update, checkpointing, or ONNX export before
# committing to a multi-hour exp_layer1_seed43 run.
#
# Expected wall time: ~3-5 min on 1x 4090.
#
# Usage:
#   uv run python train_mappo.py --config configs/smoke_layer1_v2.yaml --gpus 1
#
# Outputs: results_smoke_layer1_v2/
#
# obs_dim: 105 (A+ feature set + preferred_speed in ego).
# =============================================================================


# ---------------------------------------------------------------------------
# Training schedule (small)
# ---------------------------------------------------------------------------
seed: 42
n_envs: 16
max_agents: 30
steps_per_collect: 80000      # one full episode per env, ~128 completed episodes
n_rollouts: 5                 # ~5 PPO updates is enough to catch grad-flow issues
log_interval: 1
compile_step: true
checkpoint_interval: 1        # save policy after every rollout (debug-grade granularity)


# ---------------------------------------------------------------------------
# Curriculum -- one-phase smoke
# ---------------------------------------------------------------------------
curriculum:
  metric_window: 20
  min_episodes_per_phase: 10000   # effectively never advance during smoke

  phases:
    - name: smoke
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.0


# ---------------------------------------------------------------------------
# Environment geometry
# ---------------------------------------------------------------------------
geometry:
  min_side: 8.0
  max_side: 12.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 14.0]


# ---------------------------------------------------------------------------
# Observation -- A+ configuration (same feature set as exp_layer1_seed43;
# preferred_speed is now part of the ego state automatically, +1 dim)
# ---------------------------------------------------------------------------
observation:
  use_navmesh: true
  use_temporal_memory: true
  temporal_memory_window: 50

  use_neighbor_memory: true
  neighbor_sensing_radius: 5.0
  neighbor_vel_history_window: 5
  use_neighbor_vel_history: true
  use_neighbor_trajectory_features: false


# ---------------------------------------------------------------------------
# Action -- Layer 1 v2 caps (biomechanical envelope at dt=0.01s).
# Asymmetric desired_speed range [-0.5, +2.0] m/s and
# max_velocity_magnitude = 3.0 m/s pick up code defaults; they are not
# YAML-readable yet but were verified in the sanity check.
# ---------------------------------------------------------------------------
action:
  max_heading_change_deg: 1.146    # 115 deg/s (Layer 1)
  max_torso_change_deg:   0.573    # 57 deg/s
  max_head_change_deg:    1.719    # 172 deg/s


# ---------------------------------------------------------------------------
# Reward -- Layer 1 v2 weights (notebook 09 retune)
# ---------------------------------------------------------------------------
reward:
  goal_bonus: 20.0
  collision_penalty: -1.0
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 1.5
  inverse_distance_weight: 0.0
  speed_deviation_weight: -0.005   # Layer 1 v2 (was -0.1 in v1)
  use_smoothness: true
  wall_proximity_penalty: -0.1
  wall_proximity_threshold: 1.5
  agent_proximity_penalty_near: -0.01
  agent_proximity_penalty_far: -0.0001
  personal_space_radius: 1.0
  action_rate_weight: -0.01

# Note: jerk_penalty_weight and angular_accel_penalty_weight are not
# YAML-readable; they pick up the Layer 1 v2 code defaults (-1e-5 and -1e-2).


# ---------------------------------------------------------------------------
# Episode -- shorter than full training for fast smoke
# ---------------------------------------------------------------------------
max_steps: 500
# desired_velocity_weight omitted: picks up Layer 1 default 0.05 (tau ~200ms).

episode:
  stuck_termination_enabled: false
  stuck_window_steps: 150
  stuck_progress_threshold: 0.2


# ---------------------------------------------------------------------------
# Network architecture (same as full training so we exercise the real size)
# ---------------------------------------------------------------------------
network:
  actor_hidden: [256, 256]
  critic_hidden: [256, 256]


# ---------------------------------------------------------------------------
# PPO hyperparameters -- fewer epochs to keep wall time small
# ---------------------------------------------------------------------------
ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 4
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: constant


# ---------------------------------------------------------------------------
# Evaluation -- minimal, skip video
# ---------------------------------------------------------------------------
eval:
  n_episodes: 2
  agent_range: [8, 15]
  render_video: false
  video_scenario: 0
