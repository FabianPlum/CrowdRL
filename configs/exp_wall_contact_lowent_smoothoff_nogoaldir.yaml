# =============================================================================
# CrowdRL MAPPO -- Wall-contact, low entropy, smoothness OFF, NO goal direction
# =============================================================================
# Exact copy of exp_wall_contact_lowent_smoothoff.yaml with ONE change:
#   observation.use_goal_direction   true  ->  false
#
# Why: agents kept getting stuck oriented toward the GLOBAL goal instead of the
# local next waypoint (the goal-ward bearing dominated even when the route bent
# away from it). This run cuts the global-goal bearing from the network inputs
# entirely (the 2D goal_dir in the ego block is held at zero -- obs_dim and
# network width are unchanged, so this isolates information, not capacity). The
# policy must then navigate purely from the navmesh next-waypoint direction
# (+ path_deviation), which is also JuPedSim's modus operandi: only the next
# waypoint is exposed, never the global goal.
#
# Requires use_navmesh: true (below) -- with goal_dir cut, the navmesh waypoint
# is the ONLY destination cue. This pairs with the env change that now spawns
# agents oriented toward their first navmesh waypoint (not the global goal) and
# guarantees the stored path's final waypoint IS the goal (no truncation).
#
# Same seed (42) as the baseline for a clean A/B on the goal-direction signal.
# Both GPUs (DDP, auto via torchrun -- launch WITHOUT CUDA_VISIBLE_DEVICES).
# Output -> results_exp_wall_contact_lowent_smoothoff_nogoaldir/
# =============================================================================

seed: 42
n_envs: 64
max_agents: 100
steps_per_collect: 1280000
n_rollouts: 4000            # ~24h at observed SPS (~97k early phase)
log_interval: 5
compile_step: true
checkpoint_interval: 50    # save checkpoint_rollout_<N>.pt every 100 -- keep the peak
render_during_training: true  # CPU-render a Tier-3B example episode from each checkpoint
render_interval: 0            # 0 -> render every checkpoint (== checkpoint_interval)

curriculum:
  metric_window: 100
  min_episodes_per_phase: 500
  phases:
    - name: easy
      tiers: [TIER_0]
      agents: [5, 10]
      threshold: 0.70
    - name: medium
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.60
    - name: hard
      tiers: [TIER_1, TIER_2]
      agents: [15, 30]
      threshold: 0.50
    - name: rooms
      tiers: [TIER_2, TIER_3A]
      agents: [15, 60]
      threshold: 0.50
    - name: composed
      tiers: [TIER_3A, TIER_3B]
      agents: [20, 60]
      threshold: 0.40
    - name: full
      tiers: [TIER_0, TIER_1, TIER_2, TIER_3A, TIER_3B]
      agents: [40, 100]
      threshold: 0.0
      tier_weights: [0.05, 0.05, 0.1, 0.35, 0.45]

geometry:
  min_side: 8.0
  max_side: 15.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 18.0]

observation:
  use_navmesh: true
  use_goal_direction: false   # CUT the global-goal bearing -- navmesh waypoint is the only destination cue
  use_temporal_memory: true
  temporal_memory_window: 50

# --- Speed-turn coupling: turning sharply requires slowing down (unchanged) ---
action:
  max_heading_change_deg: 1.2     # 120 deg/s at dt=0.01 (== pivot cap)
  max_torso_change_deg: 1.2
  speed_turn_coupling: true
  turn_lat_accel: 2.0             # m/s^2 comfortable centripetal acceleration
  turn_pivot_rate_deg: 120.0      # deg/s max in-place yaw (v->0)

reward:
  goal_bonus: 20.0
  collision_penalty: -3.0         # MODERATE: was -1.0 (3x -- deter bulldozing)
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 1.5
  inverse_distance_weight: 0.0
  speed_deviation_weight: 0.0
  use_smoothness: false           # smoothness OFF
  wall_proximity_penalty: -0.1    # soft proximity band (unchanged)
  wall_proximity_threshold: 1.5
  wall_collision_penalty: -0.5    # hard penalty per step in wall contact
  agent_proximity_penalty_near: -0.025    # MODERATE: was -0.01 (5x)
  agent_proximity_penalty_far: -0.001    # MODERATE: was -0.0001 (20x -- anticipation)
  personal_space_radius: 1.0      # unchanged (narrow zone; avoid dense-crowd swamp)
  action_rate_weight: -0.01

max_steps: 2000
desired_velocity_weight: 0.8

episode:
  stuck_termination_enabled: true
  stuck_window_steps: 300
  stuck_progress_threshold: 0.2

network:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]

ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 10
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: cosine
  entropy_coef: 0.003        # was 0.02 -- cut ~7x to stop runaway entropy inflation

eval:
  n_episodes: 10
  agent_range: [8, 25]
  render_video: true
  video_scenario: 7
