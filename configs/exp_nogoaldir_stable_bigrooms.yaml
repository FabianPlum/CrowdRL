# =============================================================================
# CrowdRL MAPPO -- no-goal-dir + stability fixes + larger rooms (warm-started)
# =============================================================================
# Successor to exp_wall_contact_lowent_smoothoff_nogoaldir.yaml. That run learned
# well (peak GoalRate 0.899 @ rollout 855 on the full curriculum) then DETONATED
# in a single rollout (r1000): a collision cascade (coll_ag -4 -> -578) blew up
# value_loss (0.09 -> 5.04) -> exploding grad -> NaN weights -> dead run. The
# underlying setup was a slow entropy/log_std runaway (std ~0.5 -> ~1.2).
#
# Changes vs. the predecessor:
#  (1) Single next-waypoint nav signal -- the torch obs builder no longer BLENDS
#      the current+next waypoint (code). Removes a train/deploy divergence and
#      matches the numpy builder + JuPedSim ("next waypoint is all there is").
#  (2) Numerical guardrails (A): Huber value loss (bounds the value-grad that
#      exploded), max_grad_norm 10 -> 1, plus a NaN/non-finite grad-skip in the
#      MAPPO updater (code) so one freak batch can't poison the weights.
#  (3) Entropy/log_std runaway (B): policy log_std hard-clamped to <= exp(0)=1.0
#      (code), and entropy_coef 0.003 -> 0.001 so the policy can sharpen.
#  (4) Larger rooms: min_side 8 -> 12, max_side 15 -> 22. Lower agent density in
#      the dense Tier-3 phases reduces the collision pileups that triggered (1).
#
# WARM-START: launch with
#   --init_from results_exp_wall_contact_lowent_smoothoff_nogoaldir/checkpoint_rollout_0850.pt
# (loads weights + obs normalizer from the pre-collapse peak; optimizer,
#  curriculum and history start fresh). Same obs dims (89), so weights load
#  cleanly; the single-waypoint nav signal is a small distribution shift the
#  policy adapts to during continued training.
#
# Both GPUs (DDP, auto via torchrun -- launch WITHOUT CUDA_VISIBLE_DEVICES).
# Output -> results_exp_nogoaldir_stable_bigrooms/
# =============================================================================

seed: 42
n_envs: 64
max_agents: 100
steps_per_collect: 1280000
n_rollouts: 4000            # ~24h at observed SPS (~97k early phase)
log_interval: 5
compile_step: true
checkpoint_interval: 50     # save checkpoint_rollout_<N>.pt every 50 -- keep the peak
render_during_training: true  # CPU-render a Tier-3B example episode from each checkpoint
render_interval: 0            # 0 -> render every checkpoint (== checkpoint_interval)

curriculum:
  metric_window: 100
  min_episodes_per_phase: 500
  phases:
    - name: easy
      tiers: [TIER_0]
      agents: [5, 10]
      threshold: 0.70
    - name: medium
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.60
    - name: hard
      tiers: [TIER_1, TIER_2]
      agents: [15, 30]
      threshold: 0.50
    - name: rooms
      tiers: [TIER_2, TIER_3A]
      agents: [15, 60]
      threshold: 0.50
    - name: composed
      tiers: [TIER_3A, TIER_3B]
      agents: [20, 60]
      threshold: 0.40
    - name: full
      tiers: [TIER_0, TIER_1, TIER_2, TIER_3A, TIER_3B]
      agents: [40, 100]
      threshold: 0.0
      tier_weights: [0.05, 0.05, 0.1, 0.35, 0.45]

geometry:
  min_side: 12.0            # was 8.0 -- larger rooms (lower density in Tier-3 phases)
  max_side: 22.0            # was 15.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 18.0]

observation:
  use_navmesh: true
  use_goal_direction: false   # CUT the global-goal bearing -- navmesh waypoint is the only destination cue
  use_temporal_memory: true
  temporal_memory_window: 50

# --- Speed-turn coupling: turning sharply requires slowing down (unchanged) ---
action:
  max_heading_change_deg: 1.2     # 120 deg/s at dt=0.01 (== pivot cap)
  max_torso_change_deg: 1.2
  speed_turn_coupling: true
  turn_lat_accel: 2.0             # m/s^2 comfortable centripetal acceleration
  turn_pivot_rate_deg: 120.0      # deg/s max in-place yaw (v->0)

reward:
  goal_bonus: 20.0
  collision_penalty: -3.0         # MODERATE: was -1.0 (3x -- deter bulldozing)
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 1.5
  inverse_distance_weight: 0.0
  speed_deviation_weight: 0.0
  use_smoothness: false           # smoothness OFF
  wall_proximity_penalty: -0.1    # soft proximity band (unchanged)
  wall_proximity_threshold: 1.5
  wall_collision_penalty: -0.5    # hard penalty per step in wall contact
  agent_proximity_penalty_near: -0.025    # MODERATE: was -0.01 (5x)
  agent_proximity_penalty_far: -0.001    # MODERATE: was -0.0001 (20x -- anticipation)
  personal_space_radius: 1.0      # unchanged (narrow zone; avoid dense-crowd swamp)
  action_rate_weight: -0.01

max_steps: 2000
desired_velocity_weight: 0.8

episode:
  stuck_termination_enabled: true
  stuck_window_steps: 300
  stuck_progress_threshold: 0.2

network:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]

ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 10
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: cosine
  entropy_coef: 0.001        # B: was 0.003 -- lower so the (log_std-clamped) policy can sharpen
  max_grad_norm: 1.0         # A: was 10.0 -- tighter step bound on freak batches
  use_huber_loss: true       # A: bounds the value gradient that exploded at r1000
  huber_delta: 10.0

eval:
  n_episodes: 10
  agent_range: [8, 25]
  render_video: true
  video_scenario: 7
