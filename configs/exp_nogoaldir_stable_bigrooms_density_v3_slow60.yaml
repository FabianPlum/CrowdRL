# =============================================================================
# CrowdRL MAPPO -- density v3 SLOW60: diagnostic -- cap agent speed at 60%
# =============================================================================
# IDENTICAL to density_v3 except agents move at 60% of the max preferred speed:
#   max_forward_speed 2.0 -> 1.2  (0.6x),  max_backward_speed 0.5 -> 0.3 (0.6x).
# Everything else (reward, network, curriculum, warm-start) is v3 verbatim.
#
# WHY: every NaN failure (density r855, v2/v3 r355, v3+obsfix r355) is preceded
# by a high-density PILEUP that drives the velocity-weighted collision/wall
# penalties to extreme magnitudes (coll_ag -331, wall_c -205) and then injects a
# NaN into the policy/action path. The velocity-weighted penalties scale with
# CLOSING SPEED. Slower agents -> lower closing speeds -> softer pileups ->
# smaller penalties. This run TESTS whether closing-speed magnitude is the
# blowup driver, WITHOUT touching the reward design ("no yielding" preserved).
#   - If it clears r355: closing-speed magnitude is the driver -> informs a
#     principled reward/dynamics fix (bound the pileup, slow-in-density, etc.).
#   - If it still NaNs at r355: rules closing-speed out -> look elsewhere.
# One run, then regroup and decide what to change altogether.
#
# NOTE on the knob: "preferred speed" is reward-INERT in v3 (speed_deviation_weight
# is 0.0 -- it's only an obs feature), so the knob that actually slows the crowd
# is max_forward_speed (the desired-speed cap the policy commands into). The
# configs call the 2.0 m/s ceiling the "preferred_speed clip", so 60% -> 1.2.
#
# The obs-NaN guard (commit e48ade3) is active in code -- it closed the obs-NaN
# path but the pileup still blew up the action path at r355; this run attacks the
# pileup's VIOLENCE instead.
#
# WARM-START: launch with
#   --init_from results_exp_nogoaldir_stable_bigrooms_density/checkpoint_rollout_0500.pt
# Reward/network/obs unchanged so the weight load is clean. Both GPUs (DDP).
# Output -> results_exp_nogoaldir_stable_bigrooms_density_v3_slow60/
# Watch the high-density scorecard rows + whether it clears r355.
# =============================================================================

seed: 42
n_envs: 64
max_agents: 100
steps_per_collect: 1280000
n_rollouts: 4000
log_interval: 5
compile_step: true
checkpoint_interval: 50
render_during_training: true
render_interval: 0
scorecard_during_training: true   # periodic decomposed eval (incl. 60-100 agents)
scorecard_max_steps: 1500

curriculum:
  metric_window: 100
  min_episodes_per_phase: 500
  phases:
    - name: easy
      tiers: [TIER_0]
      agents: [5, 10]
      threshold: 0.70
    - name: medium
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.60
    - name: hard
      tiers: [TIER_1, TIER_2]
      agents: [15, 30]
      threshold: 0.50
    - name: rooms
      tiers: [TIER_2, TIER_3A]
      agents: [15, 60]
      threshold: 0.50
    - name: composed
      tiers: [TIER_3A, TIER_3B]
      agents: [20, 60]
      threshold: 0.40
    - name: full
      tiers: [TIER_0, TIER_1, TIER_2, TIER_3A, TIER_3B]
      agents: [10, 100]
      threshold: 0.0
      tier_weights: [0.05, 0.05, 0.1, 0.35, 0.45]

geometry:
  min_side: 12.0
  max_side: 22.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 18.0]

observation:
  use_navmesh: true
  use_goal_direction: false
  use_temporal_memory: true
  temporal_memory_window: 50

action:
  max_forward_speed: 1.2           # SLOW60: 2.0 -> 1.2 (0.6x) -- the diagnostic knob
  max_backward_speed: 0.3          # SLOW60: 0.5 -> 0.3 (0.6x) -- keep the asymmetry ratio
  max_heading_change_deg: 4.8      # raw per-step ceiling (240 deg/s); the coupling
  max_torso_change_deg: 4.8        # envelope below is what actually sets the rate
  speed_turn_coupling: true
  turn_lat_accel: 2.0
  turn_pivot_rate_deg: 240.0       # 2x in-place yaw (the real turn-rate knob)

reward:
  goal_bonus: 20.0
  collision_penalty: -2.0
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 2.0
  inverse_distance_weight: 0.0
  speed_deviation_weight: 0.0
  use_smoothness: false
  wall_proximity_penalty: -0.1
  wall_proximity_threshold: 1.5
  wall_collision_penalty: -0.5
  agent_proximity_penalty_near: -0.025
  agent_proximity_penalty_far: -0.001
  personal_space_radius: 0.75
  action_rate_weight: -0.001
  # --- velocity-weighted collision (P1) ---
  use_velocity_weighted_collision: true
  collision_speed_floor: 0.25
  collision_speed_scale: 0.5
  # --- velocity-weighted proximity ---
  use_velocity_weighted_proximity: true
  proximity_speed_floor: 0.0
  proximity_speed_scale: 0.5

max_steps: 3000
desired_velocity_weight: 0.8

episode:
  stuck_termination_enabled: false
  stuck_window_steps: 300
  stuck_progress_threshold: 0.2

network:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]

ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 10
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: cosine
  entropy_coef: 0.003
  max_grad_norm: 1.0
  use_huber_loss: true
  huber_delta: 10.0

eval:
  n_episodes: 10
  agent_range: [8, 25]
  render_video: true
  video_scenario: 7
