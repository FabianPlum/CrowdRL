# =============================================================================
# CrowdRL MAPPO -- P1 + option 1: velocity-weighted COLLISION and PROXIMITY
# =============================================================================
# Branch off the velcoll run (sharpturn + P1 collision weighting). velcoll
# un-froze the gridlock at r50 (stuck 0.18 -> 0.00, goal 0.64 -> 0.84) but
# RE-FROZE by r100 (stuck -> 0.22, freeze -> 0.32) as the policy optimised back
# toward avoiding the crowd. Diagnosis (fixed-eval scorecard): the residual
# freezing is driven by the agent-PROXIMITY penalty -- a distance-only ramp that
# taxes merely BEING near a neighbour, so the cheapest policy is to stop at the
# crowd's edge. P1 only reshaped the collision term, not proximity.
#
# SINGLE CHANGE vs velcoll: enable use_velocity_weighted_proximity, so the
# proximity penalty scales by CLOSING speed -- slow coexistence / threading
# through a crowd is cheap, only fast approach is taxed (same philosophy as P1).
# proximity_speed_floor 0.0 = free when not closing (removes the freezing
# driver); scale 0.5. P1 collision weighting stays ON.
#
# CAVEAT: the head-on CORRIDOR deadlock (velcoll corridor_t1 s0 hit goal 0.000)
# is a SYMMETRY problem -- neither side yields -- which proximity weighting alone
# will NOT fully fix. That needs a side-preference convention (option 3) later.
#
# WARM-START: launch with
#   --init_from results_exp_nogoaldir_stable_bigrooms/checkpoint_rollout_0150.pt
# Reward change only -- obs/network unchanged, so the weight load is clean.
# Both GPUs (DDP, auto via torchrun -- launch WITHOUT CUDA_VISIBLE_DEVICES).
# Output -> results_exp_nogoaldir_stable_bigrooms_velprox/
# A/B baseline: the velcoll run (P1 only). Compare freeze / stuck / goal with:
#   uv run python scripts/eval_scorecard.py --config <this> --checkpoint <ckpt>
# =============================================================================

seed: 42
n_envs: 64
max_agents: 100
steps_per_collect: 1280000
n_rollouts: 4000
log_interval: 5
compile_step: true
checkpoint_interval: 50
render_during_training: true
render_interval: 0

curriculum:
  metric_window: 100
  min_episodes_per_phase: 500
  phases:
    - name: easy
      tiers: [TIER_0]
      agents: [5, 10]
      threshold: 0.70
    - name: medium
      tiers: [TIER_0, TIER_1]
      agents: [8, 20]
      threshold: 0.60
    - name: hard
      tiers: [TIER_1, TIER_2]
      agents: [15, 30]
      threshold: 0.50
    - name: rooms
      tiers: [TIER_2, TIER_3A]
      agents: [15, 60]
      threshold: 0.50
    - name: composed
      tiers: [TIER_3A, TIER_3B]
      agents: [20, 60]
      threshold: 0.40
    - name: full
      tiers: [TIER_0, TIER_1, TIER_2, TIER_3A, TIER_3B]
      agents: [10, 100]
      threshold: 0.0
      tier_weights: [0.05, 0.05, 0.1, 0.35, 0.45]

geometry:
  min_side: 12.0
  max_side: 22.0
  corridor_width: [2.0, 4.0]
  corridor_length: [8.0, 18.0]

observation:
  use_navmesh: true
  use_goal_direction: false
  use_temporal_memory: true
  temporal_memory_window: 50

action:
  max_heading_change_deg: 1.2
  max_torso_change_deg: 1.2
  speed_turn_coupling: true
  turn_lat_accel: 2.0
  turn_pivot_rate_deg: 120.0

reward:
  goal_bonus: 20.0
  collision_penalty: -2.0
  timeout_penalty: -10.0
  existence_penalty: -0.01
  progress_weight: 1.5
  inverse_distance_weight: 0.0
  speed_deviation_weight: 0.0
  use_smoothness: false
  wall_proximity_penalty: -0.1
  wall_proximity_threshold: 1.5
  wall_collision_penalty: -0.5
  agent_proximity_penalty_near: -0.025
  agent_proximity_penalty_far: -0.001
  personal_space_radius: 1.0
  action_rate_weight: -0.001
  # --- P1: impact-speed weighting (collision + wall), carried over from velcoll ---
  use_velocity_weighted_collision: true
  collision_speed_floor: 0.5
  collision_speed_scale: 0.5
  # --- Option 1: closing-speed weighting (proximity) -- THE new change (un-freeze) ---
  use_velocity_weighted_proximity: true
  proximity_speed_floor: 0.0    # free when not closing -- removes the freezing driver
  proximity_speed_scale: 0.5    # extra proximity cost per m/s of closing speed

max_steps: 2000
desired_velocity_weight: 0.8

episode:
  stuck_termination_enabled: false
  stuck_window_steps: 300
  stuck_progress_threshold: 0.2

network:
  actor_hidden: [512, 512]
  critic_hidden: [512, 512]

ppo:
  lr_actor: 5.0e-4
  lr_critic: 5.0e-4
  n_epochs: 10
  clip_epsilon: 0.2
  gamma: 0.99
  gae_lambda: 0.95
  target_kl: 0.02
  lr_schedule: cosine
  entropy_coef: 0.001
  max_grad_norm: 1.0
  use_huber_loss: true
  huber_delta: 10.0

eval:
  n_episodes: 10
  agent_range: [8, 25]
  render_video: true
  video_scenario: 7
